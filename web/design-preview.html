<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Smart Rental — Local Design Preview</title>
  <style>
    :root { color-scheme: light; font-family: Inter, system-ui, sans-serif; color: #172f67; }
    * { box-sizing: border-box; }
    body { margin: 0; padding: 24px; background: #f4f7fc; }
    header { max-width: 880px; margin: 0 auto 22px; }
    h1 { font-size: 25px; margin: 8px 0; }
    p { margin: 0; line-height: 1.5; color: #51617f; }
    .tag { display: inline-block; padding: 5px 10px; border-radius: 999px;
      background: #e6efff; color: #234b9d; font-size: 12px; font-weight: 700; }
    .phones { display: flex; flex-wrap: wrap; justify-content: center; gap: 28px; }
    section { width: min(100%, 414px); }
    section h2 { font-size: 17px; margin: 0 0 9px 7px; }
    .phone { width: 100%; height: 860px; border: 8px solid #1d356c;
      border-radius: 30px; overflow: hidden; background: white;
      box-shadow: 0 15px 40px #172f6722; }
    iframe { width: 100%; height: 100%; border: 0; display: block; }
    .open { display: inline-block; margin: 9px 7px 0; color: #234b9d; font-weight: 600; }
    @media (max-width: 460px) { body { padding: 12px; } h1 { font-size: 21px; } }
  </style>
</head>
<body>
  <header>
    <span class="tag">LOCAL DESIGN PREVIEW · SAMPLE DATA</span>
    <h1>Owner and Cleaning Service Provider</h1>
    <p>Explore both modules without signing in. Changes here are temporary and do not affect Supabase or your real account.</p>
  </header>
  <main class="phones">
    <section>
      <h2>Property Owner</h2>
      <div class="phone"><iframe src="/?preview=owner" title="Property Owner preview"></iframe></div>
      <a class="open" href="/?preview=owner" target="_blank" rel="noopener">Open Owner full screen</a>
    </section>
    <section>
      <h2>Cleaning Service Provider</h2>
      <div class="phone"><iframe src="/?preview=provider" title="Cleaning Service Provider preview"></iframe></div>
      <a class="open" href="/?preview=provider" target="_blank" rel="noopener">Open Provider full screen</a>
    </section>
  </main>
</body>
</html>
