plugins {
    id "com.android.application"
    id "kotlin-android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
}

def releaseKeystoreFile = rootProject.file('key.properties')
def releaseKeystore = new Properties()
if (releaseKeystoreFile.exists()) {
    releaseKeystoreFile.withInputStream { releaseKeystore.load(it) }
    ['storeFile', 'storePassword', 'keyAlias', 'keyPassword'].each { field ->
        if (!releaseKeystore[field]) {
            throw new GradleException("Missing $field in android/key.properties")
        }
    }
}

android {
    namespace = "com.example.rentalapp.rental_app_demo"
    // Required by the OS-backed auth vault plugin; minSdk remains 23.
    compileSdk = 36
    ndkVersion = flutter.ndkVersion

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_17
    }

    defaultConfig {
        // TODO: Specify your own unique Application ID (https://developer.android.com/studio/build/application-id.html).
        applicationId = "com.example.rentalapp.rental_app_demo"
        // You can update the following values to match your application needs.
        // For more information, see: https://flutter.dev/to/review-gradle-config.
        minSdk = 23
        targetSdk = 34
        versionCode = flutter.versionCode
        versionName = flutter.versionName
    }

    signingConfigs {
        release {
            if (releaseKeystoreFile.exists()) {
                storeFile file(releaseKeystore['storeFile'])
                storePassword releaseKeystore['storePassword']
                keyAlias releaseKeystore['keyAlias']
                keyPassword releaseKeystore['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            // A debug-signed APK remains available for local release-mode QA.
            // A Play Store bundle requires the private upload key below.
            signingConfig = releaseKeystoreFile.exists()
                ? signingConfigs.release
                : signingConfigs.debug
        }
    }
}

tasks.matching { it.name == 'bundleRelease' }.configureEach {
    doFirst {
        if (!releaseKeystoreFile.exists()) {
            throw new GradleException(
                'Android App Bundle requires android/key.properties and a private upload keystore. '
                + 'Do not publish a debug-signed build.'
            )
        }
    }
}

flutter {
    source = "../.."
}
