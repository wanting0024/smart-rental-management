name: rental_app_demo
description: Smart Rental Management FYP - Owner and Cleaning Service Provider modules, local demo and connected implementation.
publish_to: 'none'
version: 0.1.8+9

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  image_picker: ^1.1.2
  shared_preferences: ^2.2.3
  # 11.x needs Dart 3.8; keep this project on its current Dart 3.5 toolchain.
  flutter_secure_storage: 10.3.1
  equatable: ^2.0.5
  intl: ^0.19.0
  flutter_svg: ^2.1.0
  # 6.4.1 uses a Gradle Flutter extension unavailable in this project's toolchain.
  app_links: 6.4.0
  supabase_flutter: ^2.15.4
  crypto: ^3.0.7
  image: 4.12.0
  web: ^1.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  # Explicit test-only transport seam for bounded Staging fault injection.
  http: ^1.6.0
  flutter_lints: ^4.0.0
  bloc_test: ^9.1.7

flutter:
  uses-material-design: true
  assets:
    - assets/figma/
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter.ttf
